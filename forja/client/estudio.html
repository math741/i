<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja — Estúdio de animação</title>
<style>
html, body { margin: 0; height: 100%; background: #07090b; color: #e7e4dc; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
#vista { position: absolute; inset: 0; width: 100%; height: 100%; }
#painel { position: absolute; left: 12px; top: 12px; width: 250px; background: rgba(18,21,26,.9); border: 1px solid #2a3038; border-radius: 10px; padding: 10px; }
#painel h1 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 8px; color: #9aa1a8; }
#clipes button, .ctl button { display: block; width: 100%; text-align: left; margin: 3px 0; background: #1b2128; color: #e7e4dc; border: 1px solid #333c46; border-radius: 6px; padding: 6px 8px; cursor: pointer; font: inherit; }
#clipes button.sel { border-color: #ffb347; background: #2a2418; }
.ctl { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.ctl button { text-align: center; }
#titulo { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 700; letter-spacing: .06em; text-shadow: 0 2px 10px #000; }
#tempo { position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%); color: #9aa1a8; font: 12px ui-monospace, monospace; }
#dica { position: absolute; right: 12px; bottom: 12px; color: #9aa1a8; font-size: 12px; }
</style>
</head>
<body>
<canvas id="vista"></canvas>
<div id="painel"><h1>Estúdio de animação</h1><div id="clipes"></div>
  <div class="ctl"><button id="lento">Câmera lenta</button><button id="pausar">Pausar</button><button id="qual" style="grid-column:1/3">Gráficos: alto</button></div></div>
<div id="tempo"></div><div id="titulo"></div>
<div id="dica">arraste para orbitar · roda para aproximar</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="js/estudio.js"></script>
</body>
</html>
